name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build
        run: zig build

      - name: Run Tests
        run: zig build test

      - name: Test CLI
        run: |
          ./zig-out/bin/jake --version
          ./zig-out/bin/jake --help
        shell: bash

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Check Formatting
        run: zig fmt --check src/

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build Release
        run: zig build -Doptimize=ReleaseFast

      - name: Run E2E Tests
        run: |
          cd tests/e2e
          ../../zig-out/bin/jake test-all

  completions:
    name: Completion Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install shells
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish

      - name: Build Release
        run: zig build -Doptimize=ReleaseFast

      - name: Run completion tests
        run: ./tests/completions_test.sh

  editors:
    name: Editor Plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check Editor Plugin Sync
        run: ./editors/sync.sh --check

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Test Tree-sitter Grammar
        run: |
          cd editors/tree-sitter-jake
          npm ci
          npx tree-sitter test
