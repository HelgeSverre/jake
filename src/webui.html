<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jake - Web UI</title>
  <style>
    :root {
      /* Colors - Accent */
      --color-accent: #f43f5e;
      --color-accent-light: #fb7185;
      --color-accent-dark: #e11d48;
      /* Colors - Semantic */
      --color-success: #22c55e;
      --color-error: #ef4444;
      --color-info: #60a5fa;
      --color-warning: #eab308;
      --color-purple: #a855f7;
      /* Colors - Background (dark to light) */
      --bg-base: #0a0a0a;
      --bg-surface: #111;
      --bg-elevated: #1a1a1a;
      --bg-overlay: #222;
      /* Colors - Text */
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      /* Colors - Border */
      --border-default: #27272a;
      --border-light: #3f3f46;
      /* Spacing */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 12px;
      --space-lg: 16px;
      --space-xl: 20px;
      /* Font sizes */
      --text-xs: 9px;
      --text-sm: 10px;
      --text-base: 11px;
      --text-md: 12px;
      --text-lg: 13px;
      /* Border radius */
      --radius-sm: 4px;
      --radius-md: 5px;
      --radius-lg: 8px;
      --radius-full: 9999px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font: 13px/1.4 system-ui, -apple-system, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }
    #app { display: flex; flex-direction: column; height: 100%; }

    /* Focus styles */
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
    .focusable:focus { background: var(--bg-elevated); }

    /* Header */
    .header {
      height: 44px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-default);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 12px;
    }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .logo-icon { font-family: ui-monospace, monospace; font-size: 16px; color: var(--color-accent); }
    .header-path {
      color: var(--text-secondary);
      font-size: 11px;
      font-family: ui-monospace, monospace;
      padding: 4px 8px;
      background: var(--bg-base);
      border-radius: 4px;
    }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .status-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 12px;
      background: var(--bg-elevated); font-size: 11px; color: var(--text-secondary);
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
    .status-dot.running { background: var(--color-accent); animation: pulse 1.5s infinite; }
    .status-dot.success { background: var(--color-success); }
    .status-dot.failed { background: var(--color-error); }
    .status-dot.connected { background: var(--color-success); }
    .status-dot.disconnected { background: var(--color-error); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    .elapsed { font-family: ui-monospace, monospace; font-size: 11px; color: var(--text-muted); }

    /* Main */
    .main { flex: 1; display: flex; overflow: hidden; }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-default);
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-default);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text-muted);
    }
    .sidebar-count {
      font-size: 9px;
      padding: 2px 6px;
      background: var(--bg-elevated);
      border-radius: 8px;
      color: var(--text-muted);
    }
    .search-box {
      padding: 8px;
      border-bottom: 1px solid var(--border-default);
    }
    .search-input {
      width: 100%;
      padding: 6px 8px;
      background: var(--bg-base);
      border: 1px solid var(--border-default);
      border-radius: 4px;
      color: var(--text-primary);
      font: inherit;
      font-size: 11px;
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus { border-color: var(--color-accent); }
    .recipe-list { flex: 1; overflow-y: auto; padding: 4px; }
    .recipe-group { margin-bottom: 8px; }
    .recipe-group.collapsed .recipe { display: none; }
    .recipe-group-title {
      padding: 6px 10px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .5px;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .recipe-group-title .chevron { transition: transform 0.15s; }
    .recipe-group.collapsed .recipe-group-title .chevron { transform: rotate(-90deg); }
    .recipe-group-title:hover { color: var(--text-secondary); }
    .recipe {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      border: 1px solid transparent;
      transition: all .1s;
    }
    .recipe:hover { background: var(--bg-elevated); }
    .recipe:focus-visible { border-color: var(--color-accent); background: var(--bg-elevated); }
    .recipe.selected { background: rgba(244,63,94,.12); border-color: rgba(244,63,94,.3); }
    .recipe-icon { width: 14px; text-align: center; font-size: 10px; }
    .recipe-icon.pending { color: var(--text-muted); }
    .recipe-icon.running { color: var(--color-accent); }
    .recipe-icon.success { color: var(--color-success); }
    .recipe-icon.failed { color: var(--color-error); }
    .recipe-name { font-family: ui-monospace, monospace; flex: 1; }
    .recipe-badge {
      font-size: 8px;
      padding: 1px 4px;
      border-radius: 3px;
      background: var(--bg-base);
      color: var(--text-muted);
    }
    .recipe-badge.default { background: rgba(244,63,94,.15); color: var(--color-accent); }
    .recipe-play {
      opacity: 0;
      width: 18px; height: 18px;
      border: none; border-radius: 3px;
      background: var(--color-accent);
      color: white;
      font-size: 7px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .1s;
    }
    .recipe:hover .recipe-play,
    .recipe:focus-visible .recipe-play { opacity: 1; }
    .recipe-play:hover { background: var(--color-accent-light); }

    /* Content */
    .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* Empty State */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      gap: 8px;
    }
    .empty-icon { font-size: 32px; opacity: .3; }
    .empty-hint { font-size: 11px; }
    kbd {
      padding: 2px 5px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-default);
      border-radius: 3px;
      font-family: ui-monospace, monospace;
      font-size: 10px;
    }

    /* Detail Panel */
    .detail-panel {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-default);
      display: none;
    }
    .detail-panel.visible { display: block; }
    .detail-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-default);
    }
    .detail-name {
      font-family: ui-monospace, monospace;
      font-size: 15px;
      font-weight: 600;
      color: var(--color-accent);
    }
    .detail-status {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--bg-elevated);
      color: var(--text-secondary);
    }
    .detail-status.success { background: rgba(34,197,94,.15); color: var(--color-success); }
    .detail-status.running { background: rgba(244,63,94,.15); color: var(--color-accent); }
    .detail-status.failed { background: rgba(239,68,68,.15); color: var(--color-error); }
    .detail-time { margin-left: auto; font-family: ui-monospace, monospace; font-size: 11px; color: var(--text-muted); }
    .detail-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
    .detail-desc { color: var(--text-secondary); font-size: 12px; line-height: 1.5; }
    .detail-row {
      display: flex;
      gap: 20px;
    }
    .detail-section { flex: 1; }
    .detail-label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .detail-value { font-size: 12px; color: var(--text-secondary); }
    .dep-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .dep-badge {
      font-size: 10px;
      padding: 2px 6px;
      background: var(--bg-base);
      border-radius: 3px;
      color: var(--text-secondary);
      font-family: ui-monospace, monospace;
    }
    .dep-badge:hover { background: var(--bg-elevated); cursor: pointer; }

    /* Parameters */
    .params-list { display: flex; flex-direction: column; gap: 8px; }
    .param-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .param-name {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      color: var(--color-info);
      min-width: 80px;
    }
    .param-input {
      flex: 1;
      padding: 5px 8px;
      background: var(--bg-base);
      border: 1px solid var(--border-default);
      border-radius: 4px;
      color: var(--text-primary);
      font: inherit;
      font-family: ui-monospace, monospace;
      font-size: 11px;
    }
    .param-input:focus { border-color: var(--color-accent); }
    .param-input::placeholder { color: var(--text-muted); }
    .param-default {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Command Preview */
    .cmd-block { display: flex; flex-direction: column; gap: var(--space-sm); }
    .cmd-content {
      background: var(--bg-base);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      font-family: ui-monospace, monospace;
      font-size: var(--text-base);
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .cmd-line { padding: 1px 0; }
    .cmd-line .keyword { color: var(--color-accent); }
    .cmd-line .string { color: var(--color-success); }
    .cmd-line .comment { color: var(--text-muted); }

    /* Action Bar */
    .action-bar {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      border-top: 1px solid var(--border-default);
      background: var(--bg-elevated);
    }
    .btn {
      height: 32px;
      padding: 0 14px;
      border: none;
      border-radius: var(--radius-md);
      font: inherit;
      font-size: var(--text-md);
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all .1s;
    }
    .btn-primary { background: var(--color-accent); color: white; }
    .btn-primary:hover { background: var(--color-accent-light); }
    .btn-primary:focus-visible { box-shadow: 0 0 0 2px var(--bg-base), 0 0 0 4px var(--color-accent); }
    .btn-primary:disabled { background: var(--text-muted); cursor: default; }
    .btn-secondary { background: var(--bg-base); color: var(--text-secondary); border: 1px solid var(--border-default); }
    .btn-secondary:hover { background: var(--bg-overlay); border-color: var(--border-light); }
    .btn-secondary:focus-visible { border-color: var(--color-accent); }
    .btn-stop { background: var(--bg-base); color: var(--color-error); border: 1px solid var(--border-default); }
    .btn-stop:hover { background: rgba(239,68,68,.1); border-color: var(--color-error); }
    .btn-kbd {
      font-size: 9px;
      padding: 1px 4px;
      background: rgba(255,255,255,.1);
      border-radius: 2px;
      margin-left: 4px;
    }

    /* Output Section */
    .output-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .output-header {
      padding: 8px 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-default);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .output-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text-muted);
    }
    .output-actions { display: flex; gap: 8px; }
    .output-btn {
      font-size: 10px;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .output-btn:hover { color: var(--text-secondary); background: var(--bg-elevated); }
    .output {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      background: #090909;
      line-height: 1.6;
    }
    .out-line { padding: 1px 0; }
    .out-line.muted { color: var(--text-muted); }
    .out-line.cmd { color: var(--text-secondary); }
    .out-line.cmd::before { content: '$ '; color: var(--text-muted); }
    .out-line.info { color: var(--color-info); }
    .out-line.success { color: var(--color-success); }
    .out-line.error { color: var(--color-error); }
    .out-line.warning { color: var(--color-warning); }
    .out-line.dim { color: var(--text-muted); }
    .out-task {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 0 4px;
      color: var(--color-accent);
      font-weight: 500;
    }
    .out-task:first-child { padding-top: 0; }
    .out-task .deps { font-weight: 400; font-size: 10px; color: var(--text-muted); }
    .out-done {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0 6px;
    }
    .out-done.success { color: var(--color-success); }
    .out-done.failed { color: var(--color-error); }
    .out-done .time { margin-left: auto; color: var(--text-muted); }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 10px; height: 10px;
      border: 1.5px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }

    /* Footer */
    .footer {
      height: 26px;
      background: var(--bg-elevated);
      border-top: 1px solid var(--border-default);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 10px;
      color: var(--text-muted);
    }
    .footer-left { display: flex; align-items: center; gap: 16px; }
    .footer-hint { display: flex; align-items: center; gap: 4px; }
  </style>
</head>
<body>
<div id="app">
  <header class="header">
    <div class="logo"><span class="logo-icon">{j}</span><span>Jake</span></div>
    <span class="header-path" id="headerPath">~/projects/jake</span>
    <div class="header-right">
      <span id="elapsed" class="elapsed">0.00s</span>
      <div class="status-pill">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">Connecting...</span>
      </div>
    </div>
  </header>

  <main class="main">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Recipes</span>
        <span class="sidebar-count" id="recipeCount">0</span>
      </div>
      <div class="search-box">
        <input type="text" class="search-input" placeholder="Filter... (Ctrl+K)" id="searchInput" oninput="filterRecipes(this.value)">
      </div>
      <div id="recipeList" class="recipe-list"></div>
    </aside>

    <div class="content">
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">{j}</div>
        <div>Select a recipe to view details</div>
        <div class="empty-hint">Use <kbd>j</kbd> <kbd>k</kbd> to navigate, <kbd>Enter</kbd> to run</div>
      </div>

      <div id="detailPanel" class="detail-panel">
        <div class="detail-header">
          <span id="detailName" class="detail-name"></span>
          <span id="detailStatus" class="detail-status"></span>
          <span id="detailTime" class="detail-time"></span>
        </div>
        <div class="detail-body">
          <div id="detailDesc" class="detail-desc"></div>
          <div class="detail-row">
            <div class="detail-section">
              <div class="detail-label">Dependencies</div>
              <div id="detailDeps" class="detail-value"></div>
            </div>
            <div class="detail-section">
              <div class="detail-label">Group</div>
              <div id="detailGroup" class="detail-value"></div>
            </div>
          </div>
          <div id="paramsSection" style="display:none;">
            <div class="detail-label">Parameters</div>
            <div id="paramsList" class="params-list"></div>
          </div>
          <div id="cmdBlock" class="cmd-block"></div>
        </div>
        <div class="action-bar">
          <button id="runBtn" class="btn btn-primary" onclick="runSelected()">
            Run <span class="btn-kbd">Enter</span>
          </button>
          <button class="btn btn-secondary" onclick="runSelected(true)">
            Dry Run <span class="btn-kbd">Shift+Enter</span>
          </button>
          <button id="stopBtn" class="btn btn-stop" onclick="stopRunning()" style="display:none;">
            Stop <span class="btn-kbd">Esc</span>
          </button>
        </div>
      </div>

      <div id="outputSection" class="output-section" style="display:none;">
        <div class="output-header">
          <span class="output-title">Output</span>
          <div class="output-actions">
            <button class="output-btn" onclick="copyOutput()">Copy</button>
            <button class="output-btn" onclick="clearOutput()">Clear</button>
          </div>
        </div>
        <div id="output" class="output"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-left">
      <div class="footer-hint"><kbd>j</kbd><kbd>k</kbd> Navigate</div>
      <div class="footer-hint"><kbd>Enter</kbd> Run</div>
      <div class="footer-hint"><kbd>Ctrl+K</kbd> Search</div>
    </div>
    <span>Jake Web UI</span>
  </footer>
</div>

<script>
// WebSocket connection
let ws = null;
let reconnectAttempts = 0;

// Recipe data (populated from server)
let recipes = [];

let selected = null;
let taskState = {};
let running = null;
let start = 0;
let timers = [];
let elapsedTimer = null;
let filter = '';
let paramValues = {};
let collapsedGroups = new Set();

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

// ============================================================================
// WebSocket Connection
// ============================================================================

function connect() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${location.host}/ws`);

  ws.onopen = () => {
    updateConnectionStatus('connected', 'Connected');
    reconnectAttempts = 0;
  };

  ws.onclose = () => {
    updateConnectionStatus('disconnected', 'Disconnected');
    const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
    reconnectAttempts++;
    setTimeout(connect, delay);
  };

  ws.onerror = () => {
    updateConnectionStatus('disconnected', 'Error');
  };

  ws.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);
      handleServerMessage(msg);
    } catch (e) {
      console.error('Invalid message:', event.data);
    }
  };
}

function handleServerMessage(msg) {
  switch (msg.type) {
    case 'init':
      // Transform server recipes to our format
      recipes = (msg.recipes || []).map(r => ({
        id: r.name,
        group: r.external || r.group || 'other',
        desc: r.desc || '',
        deps: r.deps || [],
        params: r.params || [],
        default: r.default || false,
        cmd: r.cmd || [],
        external: r.external || null
      }));
      initTaskState();
      renderRecipes();
      updateConnectionStatus('connected', 'Ready');
      break;
    case 'task_start':
      // Handle real task start from server
      if (taskState[msg.name]) {
        taskState[msg.name].status = 'running';
        taskState[msg.name].output.push({ type: 'task', text: `${msg.name}` });
        updateRecipeStatus(msg.name);
        renderOutput();
      }
      break;
    case 'command':
      if (selected && taskState[selected]) {
        taskState[selected].output.push({ type: 'cmd', text: msg.cmd });
        renderOutput();
      }
      break;
    case 'output':
      if (selected && taskState[selected]) {
        taskState[selected].output.push({ type: msg.stderr ? 'error' : '', text: msg.line });
        renderOutput();
      }
      break;
    case 'task_complete':
      if (taskState[msg.name]) {
        taskState[msg.name].status = msg.success ? 'success' : 'failed';
        taskState[msg.name].duration = msg.duration_ms;
        taskState[msg.name].output.push({
          type: msg.success ? 'success' : 'error',
          text: `${msg.success ? 'Completed' : 'Failed'} in ${fmt(msg.duration_ms)}`
        });
        if (running === msg.name) {
          running = null;
          clearInterval(elapsedTimer);
        }
        updateRecipeStatus(msg.name);
        renderDetail();
        renderOutput();
        updateStatus();
      }
      break;
    case 'summary':
      if (selected && taskState[selected]) {
        taskState[selected].output.push({
          type: 'info',
          text: `Summary: ${msg.tasks_run} tasks, ${msg.tasks_failed} failed, ${fmt(msg.total_ms)} total`
        });
        renderOutput();
      }
      break;
    case 'error':
      if (running && taskState[running]) {
        taskState[running].output.push({ type: 'error', text: msg.message || 'Unknown error' });
        taskState[running].status = 'failed';
        updateRecipeStatus(running);
        running = null;
        clearInterval(elapsedTimer);
        renderDetail();
        renderOutput();
        updateStatus();
      }
      break;
  }
}

function updateConnectionStatus(state, text) {
  $('#statusDot').className = 'status-dot ' + state;
  $('#statusText').textContent = text;
}

// ============================================================================
// Initialization
// ============================================================================

function initTaskState() {
  taskState = {};
  paramValues = {};
  recipes.forEach(r => {
    taskState[r.id] = { status: 'pending', duration: null, output: [] };
    paramValues[r.id] = {};
    if (r.params) {
      r.params.forEach(p => paramValues[r.id][p.name] = p.default || '');
    }
  });
}

function setupKeyboard() {
  document.addEventListener('keydown', e => {
    // Ctrl+K: Focus search
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
      e.preventDefault();
      $('#searchInput').focus();
      return;
    }

    // Escape: Stop or blur
    if (e.key === 'Escape') {
      if (running) {
        stopRunning();
      } else {
        document.activeElement.blur();
      }
      return;
    }

    // Don't handle arrows if in an input field (except search)
    const isInput = document.activeElement.tagName === 'INPUT' ||
                    document.activeElement.tagName === 'TEXTAREA';

    // If search focused, arrow down goes to first recipe
    if (document.activeElement === $('#searchInput')) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        const first = $('.recipe');
        if (first) first.focus();
      }
      return;
    }

    // Skip if in other inputs
    if (isInput) return;

    // Navigation through recipe list
    const recipeEls = [...$$('.recipe')];
    const current = document.activeElement;
    const idx = recipeEls.indexOf(current);

    if (e.key === 'ArrowDown' || e.key === 'j') {
      e.preventDefault();
      if (idx === -1) {
        // Nothing focused, focus first
        if (recipeEls.length) recipeEls[0].focus();
      } else if (idx < recipeEls.length - 1) {
        recipeEls[idx + 1].focus();
      } else {
        // Wrap to first
        recipeEls[0].focus();
      }
    } else if (e.key === 'ArrowUp' || e.key === 'k') {
      e.preventDefault();
      if (idx === -1) {
        // Nothing focused, focus last
        if (recipeEls.length) recipeEls[recipeEls.length - 1].focus();
      } else if (idx > 0) {
        recipeEls[idx - 1].focus();
      } else {
        // Wrap to last
        recipeEls[recipeEls.length - 1].focus();
      }
    } else if (e.key === 'Enter' && selected) {
      // Only handle Enter if we're focused on a recipe or the Run button area
      const isOnRecipe = current.classList.contains('recipe');
      const isOnButton = current.classList.contains('btn');
      if (isOnRecipe || (!isOnButton && selected)) {
        e.preventDefault();
        if (e.shiftKey) {
          runSelected(true);
        } else {
          runSelected();
        }
      }
    }
  });
}

// ============================================================================
// Recipe List Rendering
// ============================================================================

function filterRecipes(value) {
  filter = value.toLowerCase();
  renderRecipes();
}

function toggleGroup(group) {
  if (collapsedGroups.has(group)) {
    collapsedGroups.delete(group);
  } else {
    collapsedGroups.add(group);
  }
  renderRecipes(true);
}

function renderRecipes(restoreFocus = false) {
  // Remember which element had focus before re-render
  const focusedId = document.activeElement?.dataset?.id;

  const filtered = recipes.filter(r =>
    r.id.toLowerCase().includes(filter) ||
    (r.desc && r.desc.toLowerCase().includes(filter)) ||
    (r.group && r.group.toLowerCase().includes(filter))
  );

  $('#recipeCount').textContent = filtered.length;

  // Group recipes
  const groups = {};
  filtered.forEach(r => {
    if (!groups[r.group]) groups[r.group] = [];
    groups[r.group].push(r);
  });

  let html = '';
  const sortedGroups = Object.keys(groups).sort((a, b) => {
    // External groups (Makefile, Justfile) go last
    const aExt = a === 'Makefile' || a === 'Justfile';
    const bExt = b === 'Makefile' || b === 'Justfile';
    if (aExt && !bExt) return 1;
    if (!aExt && bExt) return -1;
    return a.localeCompare(b);
  });
  for (const group of sortedGroups) {
    const items = groups[group];
    const isCollapsed = collapsedGroups.has(group);
    html += `<div class="recipe-group${isCollapsed ? ' collapsed' : ''}">`;
    html += `<div class="recipe-group-title" onclick="toggleGroup('${escapeHtml(group)}')"><svg class="chevron" width="10" height="10" viewBox="0 0 10 10"><path d="M2 3 L5 6 L8 3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>${escapeHtml(group)}</div>`;
    items.forEach(r => {
      const s = taskState[r.id] || { status: 'pending' };
      const icon = s.status === 'running' ? '<span class="spinner"></span>' :
                   s.status === 'success' ? '&#10003;' :
                   s.status === 'failed' ? '&#10007;' : '&#9675;';
      const badges = [];
      if (r.default) badges.push('<span class="recipe-badge default">default</span>');

      html += `
        <div class="recipe ${selected === r.id ? 'selected' : ''}"
             data-id="${escapeHtml(r.id)}"
             tabindex="0"
             onclick="selectRecipe('${escapeHtml(r.id)}')"
             onfocus="selectRecipe('${escapeHtml(r.id)}')">
          <span class="recipe-icon ${s.status}">${icon}</span>
          <span class="recipe-name">${escapeHtml(r.id)}</span>
          ${badges.join('')}
          <button class="recipe-play" onclick="event.stopPropagation(); runRecipe('${escapeHtml(r.id)}')" tabindex="-1" title="Run">&#9654;</button>
        </div>
      `;
    });
    html += `</div>`;
  }

  $('#recipeList').innerHTML = html || '<div style="padding:20px;color:var(--text-muted);text-align:center">No recipes found</div>';

  // Restore focus if requested and element still exists
  if (restoreFocus && focusedId) {
    const el = $(`.recipe[data-id="${focusedId}"]`);
    if (el) el.focus();
  }
}

// Update just the status icon for a recipe without full re-render
function updateRecipeStatus(id) {
  const el = $(`.recipe[data-id="${id}"]`);
  if (!el) return;

  const s = taskState[id] || { status: 'pending' };
  const iconEl = el.querySelector('.recipe-icon');
  if (!iconEl) return;

  iconEl.className = `recipe-icon ${s.status}`;
  iconEl.innerHTML = s.status === 'running' ? '<span class="spinner"></span>' :
                     s.status === 'success' ? '&#10003;' :
                     s.status === 'failed' ? '&#10007;' : '&#9675;';

  // Update selected/active state
  el.classList.toggle('selected', selected === id);
}

function selectRecipe(id, skipRender = false) {
  if (selected === id) return; // No change

  // Update selection visually without full re-render
  const prevEl = $(`.recipe[data-id="${selected}"]`);
  if (prevEl) prevEl.classList.remove('selected');

  selected = id;

  const newEl = $(`.recipe[data-id="${id}"]`);
  if (newEl) newEl.classList.add('selected');

  // Only do full render if explicitly requested (e.g., after status change)
  if (!skipRender) {
    renderDetail();
  }
}

// ============================================================================
// Detail Panel Rendering
// ============================================================================

function renderDetail() {
  if (!selected) {
    $('#detailPanel').classList.remove('visible');
    $('#emptyState').style.display = 'flex';
    $('#outputSection').style.display = 'none';
    return;
  }

  const r = recipes.find(x => x.id === selected);
  if (!r) return;

  const s = taskState[selected] || { status: 'pending', output: [] };

  $('#emptyState').style.display = 'none';
  $('#detailPanel').classList.add('visible');
  $('#outputSection').style.display = 'flex';

  // Header
  $('#detailName').textContent = r.id;

  const statusClass = s.status === 'pending' ? '' : s.status;
  const statusText = s.status === 'pending' ? 'Not run' :
                     s.status === 'running' ? 'Running...' :
                     s.status === 'success' ? 'Completed' : 'Failed';
  $('#detailStatus').className = 'detail-status ' + statusClass;
  $('#detailStatus').textContent = statusText;
  $('#detailTime').textContent = s.duration ? fmt(s.duration) : '';

  // Body
  $('#detailDesc').textContent = r.desc || 'No description';

  // Dependencies
  if (r.deps && r.deps.length) {
    $('#detailDeps').innerHTML = `<div class="dep-list">${r.deps.map(d =>
      `<span class="dep-badge" onclick="selectRecipe('${escapeHtml(d)}')">${escapeHtml(d)}</span>`
    ).join('')}</div>`;
  } else {
    $('#detailDeps').innerHTML = '<span style="color:var(--text-muted);font-style:italic">none</span>';
  }

  // Group
  $('#detailGroup').innerHTML = `<span style="color:var(--color-purple)">${escapeHtml(r.group)}</span>`;

  // Parameters
  if (r.params && r.params.length) {
    $('#paramsSection').style.display = 'block';
    $('#paramsList').innerHTML = r.params.map(p => `
      <div class="param-row">
        <span class="param-name">${escapeHtml(p.name)}</span>
        <input type="text"
               class="param-input"
               value="${escapeHtml(paramValues[r.id]?.[p.name] || '')}"
               placeholder="${escapeHtml(p.default || 'required')}"
               oninput="paramValues['${escapeHtml(r.id)}']['${escapeHtml(p.name)}'] = this.value"
               title="${escapeHtml(p.name)}">
        ${p.default ? `<span class="param-default">default: ${escapeHtml(p.default)}</span>` : ''}
      </div>
    `).join('');
  } else {
    $('#paramsSection').style.display = 'none';
  }

  // Commands (placeholder - server doesn't send these yet)
  if (r.cmd && r.cmd.length) {
    const cmdHtml = r.cmd.map(c => {
      let highlighted = escapeHtml(c)
        .replace(/(@\w+)/g, '<span class="keyword">$1</span>')
        .replace(/"([^"]*)"/g, '"<span class="string">$1</span>"')
        .replace(/(#.*)$/g, '<span class="comment">$1</span>');
      return `<div class="cmd-line">${highlighted}</div>`;
    }).join('');
    $('#cmdBlock').innerHTML = `<div class="detail-label">Commands</div><div class="cmd-content">${cmdHtml}</div>`;
    $('#cmdBlock').style.display = 'flex';
  } else {
    $('#cmdBlock').style.display = 'none';
  }

  // Buttons
  $('#runBtn').disabled = s.status === 'running';
  $('#runBtn').innerHTML = s.status === 'running'
    ? '<span class="spinner"></span> Running...'
    : 'Run <span class="btn-kbd">Enter</span>';
  $('#stopBtn').style.display = s.status === 'running' ? 'inline-flex' : 'none';

  renderOutput();
}

// ============================================================================
// Output Rendering
// ============================================================================

function renderOutput() {
  if (!selected) return;
  const s = taskState[selected] || { output: [] };
  const out = $('#output');

  if (!s.output || s.output.length === 0) {
    out.innerHTML = '<div class="out-line muted">No output yet. Click Run to execute.</div>';
    return;
  }

  out.innerHTML = s.output.map(l => `<div class="out-line ${l.type}">${escapeHtml(l.text)}</div>`).join('');
  out.scrollTop = out.scrollHeight;
}

function clearOutput() {
  if (selected && taskState[selected]) {
    taskState[selected].output = [];
    renderOutput();
  }
}

function copyOutput() {
  if (!selected || !taskState[selected]) return;
  const text = taskState[selected].output.map(l => l.text).join('\n');
  navigator.clipboard.writeText(text);
}

// ============================================================================
// Running Tasks
// ============================================================================

function runSelected(dryRun = false) {
  if (!selected) return;
  runRecipe(selected, dryRun);
}

function runRecipe(id, dryRun = false) {
  if (!taskState[id] || taskState[id].status === 'running') return;

  // Select the recipe (updates visual selection)
  selectRecipe(id);

  const r = recipes.find(x => x.id === id);
  const s = taskState[id];

  s.status = 'running';
  s.duration = null;
  s.output = [];
  running = id;
  start = Date.now();

  updateRecipeStatus(id);
  renderDetail();
  updateStatus();

  elapsedTimer = setInterval(() => {
    $('#elapsed').textContent = fmt(Date.now() - start);
  }, 100);

  // Add task header
  const depsText = r.deps && r.deps.length ? ` [${r.deps.join(', ')}]` : '';
  s.output.push({ type: 'task', text: `${id}${depsText}` });

  if (dryRun) {
    s.output.push({ type: 'info', text: '[dry-run] Would execute recipe' });
    renderOutput();
    timers.push(setTimeout(() => {
      finishRun(id, true, dryRun);
    }, 500));
    return;
  }

  // Send run command to server via WebSocket
  if (ws && ws.readyState === WebSocket.OPEN) {
    const params = paramValues[id] || {};
    ws.send(JSON.stringify({ action: 'run', recipe: id, params, dryRun }));
    s.output.push({ type: 'muted', text: 'Executing recipe...' });
    renderOutput();
    // Server will respond with task_start, output, and task_complete messages
  } else {
    s.output.push({ type: 'error', text: 'Not connected to server' });
    finishRun(id, false, dryRun);
  }
}

function finishRun(id, success, dryRun) {
  const s = taskState[id];
  if (!s) return;

  s.status = success ? 'success' : 'failed';
  s.duration = Date.now() - start;

  const icon = success ? '&#10003;' : '&#10007;';
  const suffix = dryRun ? ' (dry run)' : '';
  s.output.push({ type: success ? 'success' : 'error', text: `${success ? 'Completed' : 'Failed'} in ${fmt(s.duration)}${suffix}` });

  running = null;
  clearInterval(elapsedTimer);
  timers = [];

  updateRecipeStatus(id);
  renderDetail();
  renderOutput();
  updateStatus();
}

function stopRunning() {
  if (!running) return;

  const id = running;
  const s = taskState[id];

  timers.forEach(clearTimeout);
  timers = [];
  clearInterval(elapsedTimer);

  s.status = 'failed';
  s.duration = Date.now() - start;
  s.output.push({ type: 'error', text: 'Stopped by user' });

  // Send stop command to server
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ action: 'stop' }));
  }

  running = null;

  updateRecipeStatus(id);
  renderDetail();
  renderOutput();
  updateStatus();
}

function updateStatus() {
  const dot = $('#statusDot');
  const txt = $('#statusText');

  if (running) {
    dot.className = 'status-dot running';
    txt.textContent = `Running: ${running}`;
  } else {
    const success = Object.values(taskState).filter(s => s.status === 'success').length;
    const failed = Object.values(taskState).filter(s => s.status === 'failed').length;

    if (failed > 0) {
      dot.className = 'status-dot failed';
      txt.textContent = `${failed} failed`;
    } else if (success > 0) {
      dot.className = 'status-dot success';
      txt.textContent = `${success} completed`;
    } else {
      dot.className = 'status-dot connected';
      txt.textContent = 'Ready';
    }
  }
}

// ============================================================================
// Utilities
// ============================================================================

function escapeHtml(text) {
  if (!text) return '';
  return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmt(ms) { return (ms/1000).toFixed(2) + 's'; }

// ============================================================================
// Initialize
// ============================================================================

connect();
setupKeyboard();
</script>
</body>
</html>
