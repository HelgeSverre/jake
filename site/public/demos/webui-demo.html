<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jake Web UI - Interactive Demo</title>
  <style>
    :root {
      --jake: #f43f5e;
      --jake-light: #fb7185;
      --jake-dark: #e11d48;
      --green: #22c55e;
      --red: #ef4444;
      --blue: #60a5fa;
      --yellow: #eab308;
      --purple: #a855f7;
      --muted: #71717a;
      --bg: #0a0a0a;
      --bg2: #111;
      --bg3: #1a1a1a;
      --bg4: #222;
      --text: #fafafa;
      --text2: #a1a1aa;
      --border: #27272a;
      --border-light: #3f3f46;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font: 13px/1.4 system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }
    #app { display: flex; flex-direction: column; height: 100%; }

    /* Focus styles */
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--jake); outline-offset: 2px; }
    .focusable:focus { background: var(--bg3); }

    /* Header */
    .header {
      height: 44px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 12px;
    }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .logo-icon { font-family: ui-monospace, monospace; font-size: 16px; color: var(--jake); }
    .header-path {
      color: var(--text2);
      font-size: 11px;
      font-family: ui-monospace, monospace;
      padding: 4px 8px;
      background: var(--bg);
      border-radius: 4px;
    }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; line-height: 0; }
    .status-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 12px;
      background: var(--bg3); font-size: 11px; color: var(--text2);
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
    .status-dot.running { background: var(--jake); animation: pulse 1.5s infinite; }
    .status-dot.success { background: var(--green); }
    .status-dot.failed { background: var(--red); }
    .status-dot.connected { background: var(--green); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    .elapsed { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); }

    /* Main */
    .main { flex: 1; display: flex; overflow: hidden; }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
    }
    .sidebar-count {
      font-size: 9px;
      padding: 2px 6px;
      background: var(--bg3);
      border-radius: 8px;
      color: var(--muted);
    }
    .search-box {
      padding: 8px;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      width: 100%;
      padding: 6px 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font: inherit;
      font-size: 11px;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: var(--jake); }
    .recipe-list { flex: 1; overflow-y: auto; padding: 4px; }
    .recipe-group { margin-bottom: 8px; }
    .recipe-group-title {
      padding: 6px 10px;
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .recipe {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      border: 1px solid transparent;
      transition: all .1s;
    }
    .recipe:hover { background: var(--bg3); }
    .recipe:focus-visible { border-color: var(--jake); background: var(--bg3); }
    .recipe.selected { background: rgba(244,63,94,.12); border-color: rgba(244,63,94,.3); }
    .recipe-icon { width: 14px; text-align: center; font-size: 10px; }
    .recipe-icon.pending { color: var(--muted); }
    .recipe-icon.running { color: var(--jake); }
    .recipe-icon.success { color: var(--green); }
    .recipe-icon.failed { color: var(--red); }
    .recipe-name { font-family: ui-monospace, monospace; flex: 1; }
    .recipe-badge {
      font-size: 8px;
      padding: 1px 4px;
      border-radius: 3px;
      background: var(--bg);
      color: var(--muted);
    }
    .recipe-badge.default { background: rgba(244,63,94,.15); color: var(--jake); }
    .recipe-play {
      opacity: 0;
      width: 18px; height: 18px;
      border: none; border-radius: 3px;
      background: var(--jake);
      color: white;
      font-size: 7px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .1s;
    }
    .recipe:hover .recipe-play,
    .recipe:focus-visible .recipe-play { opacity: 1; }
    .recipe-play:hover { background: var(--jake-light); }

    /* Content */
    .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* Empty State */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 8px;
    }
    .empty-icon { font-size: 32px; opacity: .3; }
    .empty-hint { font-size: 11px; }
    kbd {
      padding: 2px 5px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 3px;
      font-family: ui-monospace, monospace;
      font-size: 10px;
    }

    /* Detail Panel */
    .detail-panel {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: none;
    }
    .detail-panel.visible { display: block; }
    .detail-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .detail-name {
      font-family: ui-monospace, monospace;
      font-size: 15px;
      font-weight: 600;
      color: var(--jake);
    }
    .detail-status {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--bg3);
      color: var(--text2);
    }
    .detail-status.success { background: rgba(34,197,94,.15); color: var(--green); }
    .detail-status.running { background: rgba(244,63,94,.15); color: var(--jake); }
    .detail-status.failed { background: rgba(239,68,68,.15); color: var(--red); }
    .detail-time { margin-left: auto; font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); }
    .detail-body { padding: 12px 14px; }
    .detail-desc { color: var(--text2); font-size: 12px; line-height: 1.5; margin-bottom: 12px; }
    .detail-row {
      display: flex;
      gap: 20px;
      margin-bottom: 12px;
    }
    .detail-section { flex: 1; }
    .detail-label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .detail-value { font-size: 12px; color: var(--text2); }
    .dep-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .dep-badge {
      font-size: 10px;
      padding: 2px 6px;
      background: var(--bg);
      border-radius: 3px;
      color: var(--text2);
      font-family: ui-monospace, monospace;
    }
    .dep-badge:hover { background: var(--bg3); cursor: pointer; }

    /* Parameters */
    .params-list { display: flex; flex-direction: column; gap: 8px; }
    .param-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .param-name {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      color: var(--blue);
      min-width: 80px;
    }
    .param-input {
      flex: 1;
      padding: 5px 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font: inherit;
      font-family: ui-monospace, monospace;
      font-size: 11px;
    }
    .param-input:focus { border-color: var(--jake); }
    .param-input::placeholder { color: var(--muted); }
    .param-default {
      font-size: 10px;
      color: var(--muted);
    }

    /* Command Preview */
    .cmd-block {
      background: var(--bg);
      border-radius: 5px;
      padding: 10px 12px;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      color: var(--text2);
      line-height: 1.6;
      margin-top: 12px;
      position: relative;
    }
    .cmd-block::before {
      content: 'COMMANDS';
      position: absolute;
      top: -8px;
      left: 8px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .5px;
      color: var(--muted);
      background: var(--bg2);
      padding: 0 4px;
    }
    .cmd-line { padding: 1px 0; }
    .cmd-line .keyword { color: var(--jake); }
    .cmd-line .string { color: var(--green); }
    .cmd-line .comment { color: var(--muted); }

    /* Action Bar */
    .action-bar {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      background: var(--bg3);
    }
    .btn {
      padding: 7px 14px;
      border: none;
      border-radius: 5px;
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all .1s;
    }
    .btn-primary { background: var(--jake); color: white; }
    .btn-primary:hover { background: var(--jake-light); }
    .btn-primary:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--jake); }
    .btn-primary:disabled { background: var(--muted); cursor: default; }
    .btn-secondary { background: var(--bg); color: var(--text2); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--bg4); border-color: var(--border-light); }
    .btn-secondary:focus-visible { border-color: var(--jake); }
    .btn-stop { background: var(--bg); color: var(--red); border: 1px solid var(--border); }
    .btn-stop:hover { background: rgba(239,68,68,.1); border-color: var(--red); }
    .btn-kbd {
      font-size: 9px;
      padding: 1px 4px;
      background: rgba(255,255,255,.1);
      border-radius: 2px;
      margin-left: 4px;
    }

    /* Output Section */
    .output-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .output-header {
      padding: 8px 14px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .output-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
    }
    .output-actions { display: flex; gap: 8px; }
    .output-btn {
      font-size: 10px;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .output-btn:hover { color: var(--text2); background: var(--bg3); }
    .output {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      background: #090909;
      line-height: 1.6;
    }
    .out-line { padding: 1px 0; }
    .out-line.muted { color: var(--muted); }
    .out-line.cmd { color: var(--text2); }
    .out-line.cmd::before { content: '$ '; color: var(--muted); }
    .out-line.info { color: var(--blue); }
    .out-line.success { color: var(--green); }
    .out-line.error { color: var(--red); }
    .out-line.warning { color: var(--yellow); }
    .out-line.dim { color: var(--muted); }
    .out-task {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 0 4px;
      color: var(--jake);
      font-weight: 500;
    }
    .out-task:first-child { padding-top: 0; }
    .out-task .deps { font-weight: 400; font-size: 10px; color: var(--muted); }
    .out-done {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0 6px;
    }
    .out-done.success { color: var(--green); }
    .out-done.failed { color: var(--red); }
    .out-done .time { margin-left: auto; color: var(--muted); }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 10px; height: 10px;
      border: 1.5px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }

    /* Footer */
    .footer {
      height: 26px;
      background: var(--bg3);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 10px;
      color: var(--muted);
    }
    .footer-left { display: flex; align-items: center; gap: 16px; }
    .footer-hint { display: flex; align-items: center; gap: 4px; }

    /* Tutorial Overlay */
    .tutorial-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .tutorial-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .tutorial-highlight {
      position: relative;
      z-index: 1001;
      box-shadow: 0 0 0 4px var(--jake), 0 0 0 9999px rgba(0,0,0,0.6);
      border-radius: 8px;
    }
    .tutorial-tooltip {
      position: fixed;
      background: var(--bg2);
      border: 1px solid var(--jake);
      border-radius: 8px;
      padding: 16px;
      max-width: 300px;
      z-index: 1002;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .tutorial-tooltip h4 {
      color: var(--jake);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .tutorial-tooltip p {
      color: var(--text2);
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .tutorial-tooltip .step-indicator {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .tutorial-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .tutorial-btn {
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tutorial-btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
    }
    .tutorial-btn-secondary:hover {
      border-color: var(--border-light);
      background: var(--bg3);
    }
    .tutorial-btn-primary {
      background: var(--jake);
      border: none;
      color: white;
    }
    .tutorial-btn-primary:hover {
      background: var(--jake-light);
    }
    .tutorial-start-btn {
      position: fixed;
      bottom: 40px;
      right: 16px;
      background: var(--jake);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(244,63,94,0.3);
      transition: all 0.15s;
    }
    .tutorial-start-btn:hover {
      background: var(--jake-light);
      transform: translateY(-1px);
    }
    .tutorial-start-btn.hidden { display: none; }

    /* Demo badge */
    .demo-badge {
      position: fixed;
      top: 8px;
      right: 8px;
      background: var(--jake);
      color: white;
      font-size: 9px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      z-index: 100;
    }
  </style>
</head>
<body>
<div class="demo-badge">Demo</div>
<div id="app">
  <header class="header">
    <div class="logo"><span class="logo-icon">{j}</span><span>Jake</span></div>
    <span class="header-path" id="headerPath">~/projects/myapp</span>
    <div class="header-right">
      <span id="elapsed" class="elapsed">0.00s</span>
      <div class="status-pill">
        <div id="statusDot" class="status-dot connected"></div>
        <span id="statusText">Ready</span>
      </div>
    </div>
  </header>

  <main class="main">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Recipes</span>
        <span class="sidebar-count" id="recipeCount">0</span>
      </div>
      <div class="search-box" id="searchBox">
        <input type="text" class="search-input" placeholder="Filter... (Ctrl+K)" id="searchInput" oninput="filterRecipes(this.value)">
      </div>
      <div id="recipeList" class="recipe-list"></div>
    </aside>

    <div class="content">
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">{j}</div>
        <div>Select a recipe to view details</div>
        <div class="empty-hint">Use <kbd>j</kbd> <kbd>k</kbd> to navigate, <kbd>Enter</kbd> to run</div>
      </div>

      <div id="detailPanel" class="detail-panel">
        <div class="detail-header" id="detailHeader">
          <span id="detailName" class="detail-name"></span>
          <span id="detailStatus" class="detail-status"></span>
          <span id="detailTime" class="detail-time"></span>
        </div>
        <div class="detail-body">
          <div id="detailDesc" class="detail-desc"></div>
          <div class="detail-row">
            <div class="detail-section">
              <div class="detail-label">Dependencies</div>
              <div id="detailDeps" class="detail-value"></div>
            </div>
            <div class="detail-section">
              <div class="detail-label">Group</div>
              <div id="detailGroup" class="detail-value"></div>
            </div>
          </div>
          <div id="paramsSection" style="display:none;">
            <div class="detail-label">Parameters</div>
            <div id="paramsList" class="params-list"></div>
          </div>
          <div id="cmdBlock" class="cmd-block"></div>
        </div>
        <div class="action-bar" id="actionBar">
          <button id="runBtn" class="btn btn-primary" onclick="runSelected()">
            Run <span class="btn-kbd">Enter</span>
          </button>
          <button class="btn btn-secondary" onclick="runSelected(true)">
            Dry Run <span class="btn-kbd">Shift+Enter</span>
          </button>
          <button id="stopBtn" class="btn btn-stop" onclick="stopRunning()" style="display:none;">
            Stop <span class="btn-kbd">Esc</span>
          </button>
        </div>
      </div>

      <div id="outputSection" class="output-section" style="display:none;">
        <div class="output-header" id="outputHeader">
          <span class="output-title">Output</span>
          <div class="output-actions">
            <button class="output-btn" onclick="copyOutput()">Copy</button>
            <button class="output-btn" onclick="clearOutput()">Clear</button>
          </div>
        </div>
        <div id="output" class="output"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-left">
      <div class="footer-hint"><kbd>j</kbd><kbd>k</kbd> Navigate</div>
      <div class="footer-hint"><kbd>Enter</kbd> Run</div>
      <div class="footer-hint"><kbd>Ctrl+K</kbd> Search</div>
    </div>
    <span>Jake Web UI</span>
  </footer>
</div>

<!-- Tutorial Overlay -->
<div id="tutorialOverlay" class="tutorial-overlay"></div>
<div id="tutorialTooltip" class="tutorial-tooltip" style="display:none;"></div>
<button id="tutorialStartBtn" class="tutorial-start-btn">
  <span>?</span> Take a Tour
</button>

<script>
// ============================================================================
// Demo Data - Static recipes for the demo
// ============================================================================

const recipes = [
  {
    id: 'build',
    group: 'core',
    desc: 'Build the project with optimizations',
    deps: [],
    params: [],
    default: true,
    cmd: ['zig build -Doptimize=ReleaseFast']
  },
  {
    id: 'test',
    group: 'core',
    desc: 'Run the test suite',
    deps: ['build'],
    params: [],
    default: false,
    cmd: ['zig build test']
  },
  {
    id: 'deploy',
    group: 'core',
    desc: 'Deploy to production server',
    deps: ['build', 'test'],
    params: [{ name: 'env', default: 'production' }],
    default: false,
    cmd: ['rsync -avz ./zig-out/ server:/app/', 'ssh server "systemctl restart app"']
  },
  {
    id: 'lint',
    group: 'quality',
    desc: 'Check code formatting and style',
    deps: [],
    params: [],
    default: false,
    cmd: ['zig fmt --check src/']
  },
  {
    id: 'dev',
    group: 'dev',
    desc: 'Start development server with hot reload',
    deps: [],
    params: [{ name: 'port', default: '3000' }],
    default: false,
    cmd: ['zig build run -- --watch']
  },
  {
    id: 'clean',
    group: 'dev',
    desc: 'Remove all build artifacts',
    deps: [],
    params: [],
    default: false,
    cmd: ['rm -rf zig-out/ zig-cache/']
  },
  {
    id: 'bench',
    group: 'quality',
    desc: 'Run performance benchmarks',
    deps: ['build'],
    params: [],
    default: false,

// ============================================================================
// Tutorial System
// ============================================================================

const tutorialSteps = [
  {
    target: '#sidebar',
    title: 'Recipe Browser',
    text: 'Browse all available recipes organized by group. Click a recipe or use <kbd>j</kbd>/<kbd>k</kbd> keys to navigate.',
    position: 'right'
  },
  {
    target: '#searchBox',
    title: 'Quick Search',
    text: 'Press <kbd>Ctrl+K</kbd> to focus search and filter recipes by name, description, or group.',
    position: 'right'
  },
  {
    target: '#detailHeader',
    title: 'Recipe Details',
    text: 'View the selected recipe\'s name, status, and execution time. Dependencies are shown below.',
    position: 'bottom'
  },
  {
    target: '#actionBar',
    title: 'Run Tasks',
    text: 'Click <strong>Run</strong> or press <kbd>Enter</kbd> to execute. Use <strong>Dry Run</strong> to preview commands first.',
    position: 'top'
  },
  {
    target: '#outputHeader',
    title: 'Live Output',
    text: 'Watch real-time output as tasks execute. Copy or clear the output using the buttons.',
    position: 'top'
  }
];

let currentTutorialStep = -1;
let tutorialActive = false;

function startTutorial() {
  // First select a recipe so panels are visible
  if (!selected) {
    selectRecipe('build');
  }

  tutorialActive = true;
  currentTutorialStep = -1;
  document.getElementById('tutorialStartBtn').classList.add('hidden');
  nextTutorialStep();
}

function nextTutorialStep() {
  // Remove previous highlight
  document.querySelectorAll('.tutorial-highlight').forEach(el => {
    el.classList.remove('tutorial-highlight');
  });

  currentTutorialStep++;

  if (currentTutorialStep >= tutorialSteps.length) {
    endTutorial();
    return;
  }

  const step = tutorialSteps[currentTutorialStep];
  const targetEl = document.querySelector(step.target);

  if (!targetEl) {
    nextTutorialStep();
    return;
  }

  // Add highlight
  targetEl.classList.add('tutorial-highlight');

  // Show overlay
  document.getElementById('tutorialOverlay').classList.add('active');

  // Position and show tooltip
  const tooltip = document.getElementById('tutorialTooltip');
  tooltip.innerHTML = `
    <div class="step-indicator">Step ${currentTutorialStep + 1} of ${tutorialSteps.length}</div>
    <h4>${step.title}</h4>
    <p>${step.text}</p>
    <div class="tutorial-actions">
      <button class="tutorial-btn tutorial-btn-secondary" onclick="endTutorial()">Skip</button>
      <button class="tutorial-btn tutorial-btn-primary" onclick="nextTutorialStep()">
        ${currentTutorialStep < tutorialSteps.length - 1 ? 'Next' : 'Finish'}
      </button>
    </div>
  `;
  tooltip.style.display = 'block';

  // Position tooltip
  const rect = targetEl.getBoundingClientRect();
  const tooltipRect = tooltip.getBoundingClientRect();

  let top, left;
  switch (step.position) {
    case 'right':
      top = rect.top + (rect.height / 2) - (tooltipRect.height / 2);
      left = rect.right + 16;
      break;
    case 'bottom':
      top = rect.bottom + 16;
      left = rect.left + (rect.width / 2) - (tooltipRect.width / 2);
      break;
    case 'top':
      top = rect.top - tooltipRect.height - 16;
      left = rect.left + (rect.width / 2) - (tooltipRect.width / 2);
      break;
    default:
      top = rect.top;
      left = rect.right + 16;
  }

  // Keep within viewport
  top = Math.max(16, Math.min(top, window.innerHeight - tooltipRect.height - 16));
  left = Math.max(16, Math.min(left, window.innerWidth - tooltipRect.width - 16));

  tooltip.style.top = top + 'px';
  tooltip.style.left = left + 'px';
}

function endTutorial() {
  tutorialActive = false;
  currentTutorialStep = -1;

  document.querySelectorAll('.tutorial-highlight').forEach(el => {
    el.classList.remove('tutorial-highlight');
  });

  document.getElementById('tutorialOverlay').classList.remove('active');
  document.getElementById('tutorialTooltip').style.display = 'none';
  document.getElementById('tutorialStartBtn').classList.remove('hidden');
}

// ============================================================================
// State
// ============================================================================

let selected = null;
let taskState = {};
let running = null;
let start = 0;
let elapsedTimer = null;
let filter = '';
let paramValues = {};

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

// ============================================================================
// Initialization
// ============================================================================

function init() {
  initTaskState();
  renderRecipes();
  setupKeyboard();

  // Auto-start tutorial after a short delay
  setTimeout(() => {
    if (!tutorialActive && !selected) {
      // Pulse the tour button to attract attention
      const btn = document.getElementById('tutorialStartBtn');
      btn.style.animation = 'pulse 2s infinite';
    }
  }, 1500);
}

function initTaskState() {
  taskState = {};
  paramValues = {};
  recipes.forEach(r => {
    taskState[r.id] = { status: 'pending', duration: null, output: [] };
    paramValues[r.id] = {};
    if (r.params) {
      r.params.forEach(p => paramValues[r.id][p.name] = p.default || '');
    }
  });
}

function setupKeyboard() {
  document.addEventListener('keydown', e => {
    // Don't intercept if tutorial is active
    if (tutorialActive && e.key !== 'Escape') return;

    // Ctrl+K: Focus search
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
      e.preventDefault();
      $('#searchInput').focus();
      return;
    }

    // Escape: Stop running or close tutorial
    if (e.key === 'Escape') {
      if (tutorialActive) {
        endTutorial();
      } else if (running) {
        stopRunning();
      } else {
        document.activeElement.blur();
      }
      return;
    }

    const isInput = document.activeElement.tagName === 'INPUT' ||
                    document.activeElement.tagName === 'TEXTAREA';

    if (document.activeElement === $('#searchInput')) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        const first = $('.recipe');
        if (first) first.focus();
      }
      return;
    }

    if (isInput) return;

    const recipeEls = [...$$('.recipe')];
    const current = document.activeElement;
    const idx = recipeEls.indexOf(current);

    if (e.key === 'ArrowDown' || e.key === 'j') {
      e.preventDefault();
      if (idx === -1) {
        if (recipeEls.length) recipeEls[0].focus();
      } else if (idx < recipeEls.length - 1) {
        recipeEls[idx + 1].focus();
      } else {
        recipeEls[0].focus();
      }
    } else if (e.key === 'ArrowUp' || e.key === 'k') {
      e.preventDefault();
      if (idx === -1) {
        if (recipeEls.length) recipeEls[recipeEls.length - 1].focus();
      } else if (idx > 0) {
        recipeEls[idx - 1].focus();
      } else {
        recipeEls[recipeEls.length - 1].focus();
      }
    } else if (e.key === 'Enter' && selected) {
      const isOnRecipe = current.classList.contains('recipe');
      const isOnButton = current.classList.contains('btn');
      if (isOnRecipe || (!isOnButton && selected)) {
        e.preventDefault();
        if (e.shiftKey) {
          runSelected(true);
        } else {
          runSelected();
        }
      }
    }
  });

  // Tutorial start button
  document.getElementById('tutorialStartBtn').addEventListener('click', startTutorial);
}

// ============================================================================
// Recipe List Rendering
// ============================================================================

function filterRecipes(value) {
  filter = value.toLowerCase();
  renderRecipes();
}

function renderRecipes() {
  const filtered = recipes.filter(r =>
    r.id.toLowerCase().includes(filter) ||
    (r.desc && r.desc.toLowerCase().includes(filter)) ||
    (r.group && r.group.toLowerCase().includes(filter))
  );

  $('#recipeCount').textContent = filtered.length;

  const groups = {};
  filtered.forEach(r => {
    if (!groups[r.group]) groups[r.group] = [];
    groups[r.group].push(r);
  });

  let html = '';
  const sortedGroups = Object.keys(groups).sort();
  for (const group of sortedGroups) {
    const items = groups[group];
    html += `<div class="recipe-group">`;
    html += `<div class="recipe-group-title">${escapeHtml(group)}</div>`;
    items.forEach(r => {
      const s = taskState[r.id] || { status: 'pending' };
      const icon = s.status === 'running' ? '<span class="spinner"></span>' :
                   s.status === 'success' ? '&#10003;' :
                   s.status === 'failed' ? '&#10007;' : '&#9675;';
      const badges = [];
      if (r.default) badges.push('<span class="recipe-badge default">default</span>');

      html += `
        <div class="recipe ${selected === r.id ? 'selected' : ''}"
             data-id="${escapeHtml(r.id)}"
             tabindex="0"
             onclick="selectRecipe('${escapeHtml(r.id)}')"
             onfocus="selectRecipe('${escapeHtml(r.id)}')">
          <span class="recipe-icon ${s.status}">${icon}</span>
          <span class="recipe-name">${escapeHtml(r.id)}</span>
          ${badges.join('')}
          <button class="recipe-play" onclick="event.stopPropagation(); runRecipe('${escapeHtml(r.id)}')" tabindex="-1" title="Run">&#9654;</button>
        </div>
      `;
    });
    html += `</div>`;
  }

  $('#recipeList').innerHTML = html || '<div style="padding:20px;color:var(--muted);text-align:center">No recipes found</div>';
}

function updateRecipeStatus(id) {
  const el = $(`.recipe[data-id="${id}"]`);
  if (!el) return;

  const s = taskState[id] || { status: 'pending' };
  const iconEl = el.querySelector('.recipe-icon');
  if (!iconEl) return;

  iconEl.className = `recipe-icon ${s.status}`;
  iconEl.innerHTML = s.status === 'running' ? '<span class="spinner"></span>' :
                     s.status === 'success' ? '&#10003;' :
                     s.status === 'failed' ? '&#10007;' : '&#9675;';

  el.classList.toggle('selected', selected === id);
}

function selectRecipe(id) {
  if (selected === id) return;

  const prevEl = $(`.recipe[data-id="${selected}"]`);
  if (prevEl) prevEl.classList.remove('selected');

  selected = id;

  const newEl = $(`.recipe[data-id="${id}"]`);
  if (newEl) newEl.classList.add('selected');

  renderDetail();
}

// ============================================================================
// Detail Panel Rendering
// ============================================================================

function renderDetail() {
  if (!selected) {
    $('#detailPanel').classList.remove('visible');
    $('#emptyState').style.display = 'flex';
    $('#outputSection').style.display = 'none';
    return;
  }

  const r = recipes.find(x => x.id === selected);
  if (!r) return;

  const s = taskState[selected] || { status: 'pending', output: [] };

  $('#emptyState').style.display = 'none';
  $('#detailPanel').classList.add('visible');
  $('#outputSection').style.display = 'flex';

  $('#detailName').textContent = r.id;

  const statusClass = s.status === 'pending' ? '' : s.status;
  const statusText = s.status === 'pending' ? 'Not run' :
                     s.status === 'running' ? 'Running...' :
                     s.status === 'success' ? 'Completed' : 'Failed';
  $('#detailStatus').className = 'detail-status ' + statusClass;
  $('#detailStatus').textContent = statusText;
  $('#detailTime').textContent = s.duration ? fmt(s.duration) : '';

  $('#detailDesc').textContent = r.desc || 'No description';

  if (r.deps && r.deps.length) {
    $('#detailDeps').innerHTML = `<div class="dep-list">${r.deps.map(d =>
      `<span class="dep-badge" onclick="selectRecipe('${escapeHtml(d)}')">${escapeHtml(d)}</span>`
    ).join('')}</div>`;
  } else {
    $('#detailDeps').innerHTML = '<span style="color:var(--muted);font-style:italic">none</span>';
  }

  $('#detailGroup').innerHTML = `<span style="color:var(--purple)">${escapeHtml(r.group)}</span>`;

  if (r.params && r.params.length) {
    $('#paramsSection').style.display = 'block';
    $('#paramsList').innerHTML = r.params.map(p => `
      <div class="param-row">
        <span class="param-name">${escapeHtml(p.name)}</span>
        <input type="text"
               class="param-input"
               value="${escapeHtml(paramValues[r.id]?.[p.name] || '')}"
               placeholder="${escapeHtml(p.default || 'required')}"
               oninput="paramValues['${escapeHtml(r.id)}']['${escapeHtml(p.name)}'] = this.value"
               title="${escapeHtml(p.name)}">
        ${p.default ? `<span class="param-default">default: ${escapeHtml(p.default)}</span>` : ''}
      </div>
    `).join('');
  } else {
    $('#paramsSection').style.display = 'none';
  }

  if (r.cmd && r.cmd.length) {
    const cmdHtml = r.cmd.map(c => {
      let highlighted = escapeHtml(c)
        .replace(/(@\w+)/g, '<span class="keyword">$1</span>')
        .replace(/"([^"]*)"/g, '"<span class="string">$1</span>"')
        .replace(/(#.*)$/g, '<span class="comment">$1</span>');
      return `<div class="cmd-line">${highlighted}</div>`;
    }).join('');
    $('#cmdBlock').innerHTML = cmdHtml;
    $('#cmdBlock').style.display = 'block';
  } else {
    $('#cmdBlock').style.display = 'none';
  }

  $('#runBtn').disabled = s.status === 'running';
  $('#runBtn').innerHTML = s.status === 'running'
    ? '<span class="spinner"></span> Running...'
    : 'Run <span class="btn-kbd">Enter</span>';
  $('#stopBtn').style.display = s.status === 'running' ? 'inline-flex' : 'none';

  renderOutput();
}

// ============================================================================
// Output Rendering
// ============================================================================

function renderOutput() {
  if (!selected) return;
  const s = taskState[selected] || { output: [] };
  const out = $('#output');

  if (!s.output || s.output.length === 0) {
    out.innerHTML = '<div class="out-line muted">No output yet. Click Run to execute.</div>';
    return;
  }

  out.innerHTML = s.output.map(l => `<div class="out-line ${l.type}">${escapeHtml(l.text)}</div>`).join('');
  out.scrollTop = out.scrollHeight;
}

function clearOutput() {
  if (selected && taskState[selected]) {
    taskState[selected].output = [];
    renderOutput();
  }
}

function copyOutput() {
  if (!selected || !taskState[selected]) return;
  const text = taskState[selected].output.map(l => l.text).join('\n');
  navigator.clipboard.writeText(text);
}

// ============================================================================
// Running Tasks (Simulated)
// ============================================================================

function runSelected(dryRun = false) {
  if (!selected) return;
  runRecipe(selected, dryRun);
}

function runRecipe(id, dryRun = false) {
  if (!taskState[id] || taskState[id].status === 'running') return;

  selectRecipe(id);

  const r = recipes.find(x => x.id === id);
  const s = taskState[id];

  s.status = 'running';
  s.duration = null;
  s.output = [];
  running = id;
  start = Date.now();

  updateRecipeStatus(id);
  renderDetail();
  updateStatus();

  elapsedTimer = setInterval(() => {
    $('#elapsed').textContent = fmt(Date.now() - start);
  }, 100);

  if (dryRun) {
    s.output.push({ type: 'task', text: `${id} [dry-run]` });
    s.output.push({ type: 'info', text: '[dry-run] Would execute:' });
    r.cmd.forEach(c => {
      s.output.push({ type: 'cmd', text: c });
    });
    renderOutput();
    setTimeout(() => {
      finishRun(id, true);
    }, 500);
    return;
  }

  // Simulate execution with timed output
  const outputs = simulatedOutputs[id] || [
    { delay: 0, type: 'task', text: id },
    { delay: 500, type: 'success', text: `✓ ${id} completed` }
  ];

  outputs.forEach(item => {
    setTimeout(() => {
      if (running === id) {
        s.output.push({ type: item.type, text: item.text });
        renderOutput();

        // Check if this is the last item (success message)
        if (item.text.includes('completed')) {
          finishRun(id, true);
        }
      }
    }, item.delay);
  });
}

function finishRun(id, success) {
  const s = taskState[id];
  if (!s) return;

  s.status = success ? 'success' : 'failed';
  s.duration = Date.now() - start;

  running = null;
  clearInterval(elapsedTimer);

  updateRecipeStatus(id);
  renderDetail();
  renderOutput();
  updateStatus();
}

function stopRunning() {
  if (!running) return;

  const id = running;
  const s = taskState[id];

  clearInterval(elapsedTimer);

  s.status = 'failed';
  s.duration = Date.now() - start;
  s.output.push({ type: 'error', text: 'Stopped by user' });

  running = null;

  updateRecipeStatus(id);
  renderDetail();
  renderOutput();
  updateStatus();
}

function updateStatus() {
  const dot = $('#statusDot');
  const txt = $('#statusText');

  if (running) {
    dot.className = 'status-dot running';
    txt.textContent = `Running: ${running}`;
  } else {
    const success = Object.values(taskState).filter(s => s.status === 'success').length;
    const failed = Object.values(taskState).filter(s => s.status === 'failed').length;

    if (failed > 0) {
      dot.className = 'status-dot failed';
      txt.textContent = `${failed} failed`;
    } else if (success > 0) {
      dot.className = 'status-dot success';
      txt.textContent = `${success} completed`;
    } else {
      dot.className = 'status-dot connected';
      txt.textContent = 'Ready';
    }
  }
}

// ============================================================================
// Utilities
// ============================================================================

function escapeHtml(text) {
  if (!text) return '';
  return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmt(ms) { return (ms/1000).toFixed(2) + 's'; }

// ============================================================================
// Initialize
// ============================================================================

init();
</script>
